<meta charset="utf-8">
<title>Супер Бджолы</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;600;700&family=Rubik+Mono+One&display=swap">
<style>
/* Живой луг на холсте, карточки из воска и мёда поверх. Один тёплый мир, без тёмной темы. */
:root{
  --ink:#2e1a06; --paper:#fff4d6; --wax:#ffe7a3; --honey:#ffb21e; --honey-deep:#d97f00;
  --leaf:#2f8a3a; --berry:#d9437a; --night:#1c1530;
  --fd:'Rubik Mono One','Rubik',system-ui,sans-serif;
  --fb:'Rubik',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{margin:0;background:var(--night);color:var(--ink);overflow:hidden;touch-action:none;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;font-family:var(--fb)}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;box-sizing:border-box;
  padding:max(12px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(12px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
#ov.bottom{align-items:flex-end}
.card{background:linear-gradient(180deg,#fff8e4,var(--paper));border:3px solid var(--ink);border-radius:24px;
  box-shadow:0 6px 0 var(--ink),0 18px 40px rgba(0,0,0,.35);padding:16px 22px;max-width:660px;width:100%;box-sizing:border-box;
  display:flex;flex-direction:column;gap:12px;max-height:100%;overflow:auto;touch-action:pan-y}
.card.wide{max-width:920px}
h1{font-family:var(--fd);font-weight:400;font-size:clamp(34px,7vw,66px);margin:4px 0 0;color:var(--honey);
  -webkit-text-stroke:2px var(--ink);text-align:center;line-height:1.05;text-wrap:balance;letter-spacing:.02em}
h2{font-family:var(--fd);font-weight:400;font-size:clamp(20px,3.2vw,30px);margin:0;text-wrap:balance}
h3{margin:4px 0 0;font-size:15px;text-transform:uppercase;letter-spacing:.1em;text-align:center}
.sub{text-align:center;margin:0;font-size:19px}
.txt{font-size:clamp(18px,2.6vw,24px);line-height:1.38;margin:0;max-width:62ch}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.row.small button{font-size:15px;padding:7px 12px}
button{font:600 18px var(--fb);color:var(--ink);background:#fff;border:3px solid var(--ink);border-radius:14px;
  padding:10px 16px;box-shadow:0 4px 0 var(--ink);cursor:pointer;touch-action:manipulation}
button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
button.big{background:var(--honey);font-size:22px;padding:12px 28px}
button:disabled{opacity:.45;box-shadow:none;cursor:default;transform:none}
button:focus-visible{outline:3px solid var(--berry);outline-offset:2px}
.head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.honey{font:700 26px var(--fb);display:flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums}
.bees{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.bee{border:3px solid var(--ink);border-radius:18px;background:#fff;padding:8px 10px;display:flex;flex-direction:column;
  align-items:center;gap:5px;text-align:center;min-width:0}
.bee.own{background:var(--wax)}
.bee img{width:96px;height:96px;object-fit:contain}
.bee b{font-size:21px}
.bee span{font-size:14px}
.bee em{font-style:normal;font-weight:700;color:var(--leaf)}
.bee small{font-size:13px}
.bee button{font-size:15px;padding:7px 10px}
.ups{display:flex;flex-direction:column;gap:5px;width:100%}
.up{display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:6px;font-size:14px;text-align:left}
.up i{font-style:normal;letter-spacing:2px;color:var(--honey-deep);font-size:15px}
.up button{font-size:13px;padding:4px 8px;box-shadow:0 3px 0 var(--ink);border-width:2px;border-radius:10px;min-width:58px}
.team{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.team .up{border:3px solid var(--ink);border-radius:14px;background:#fff;padding:8px 10px;font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chip{font-size:15px;padding:7px 11px}
.chip.on{background:var(--berry);color:#fff}
.chip s{text-decoration:none;color:var(--honey-deep);margin-left:4px}
.chip.on s{color:#ffe08a}
.dots{display:flex;gap:6px;justify-content:center}
.dots i{width:10px;height:10px;border-radius:50%;background:#e2cf9b;border:2px solid var(--ink)}
.dots i.on{background:var(--honey)}
.help{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.help div{display:flex;gap:10px;align-items:center;background:#fff;border:3px solid var(--ink);border-radius:16px;padding:8px 10px;font-size:16px;line-height:1.3;min-width:0}
.help img{width:58px;height:58px;object-fit:contain;flex:none}
.help b{color:var(--honey-deep)}
.stars{font-size:34px;letter-spacing:6px;text-align:center;color:var(--honey)}
.stars span{color:#d9c79a}
#rot{position:fixed;left:0;right:0;top:0;display:none;text-align:center;font:600 16px var(--fb);
  background:var(--ink);color:var(--paper);padding:max(8px,env(safe-area-inset-top,0px)) 16px 8px;z-index:5;pointer-events:none}
@media (orientation:portrait) and (max-width:700px){#rot{display:block}}
@media (max-width:640px){.bees,.help,.team{grid-template-columns:1fr}}
@media (max-height:520px){.bee img{width:64px;height:64px}.card{padding:12px 16px;gap:8px}.help img{width:44px;height:44px}}
@media (prefers-reduced-motion:reduce){button:active{transform:none}}
</style>

<script>
'use strict';
const TAU=Math.PI*2, W=960, H=600, INK='#2e1a06';
const $=s=>document.querySelector(s);
const cv=$('#cv'); let ctx=cv.getContext('2d');
let dpr=1,sc=1,ox=0,oy=0;
function resize(){dpr=Math.min(2,window.devicePixelRatio||1);const w=innerWidth,h=innerHeight;
  cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr);sc=Math.min(w/W,h/H);ox=(w-W*sc)/2;oy=(h-H*sc)/2;}
addEventListener('resize',resize);resize();
['gesturestart','gesturechange','dblclick'].forEach(n=>document.addEventListener(n,e=>e.preventDefault(),{passive:false}));

/* ---------- картинки ---------- */
const IMG={};
['bee-me','bee-dad','bee-sis','queen','beetle','fast','big','armored','spitter','king','bear','man','device','vault','sunflower',
 'bg-meadow','bg-dusk','bg-storm','bg-night','bg-kingdom','bg-hive'].forEach(n=>{const i=new Image();i.onload=()=>{i.ok=true};i.src='art/'+n+'.webp';IMG[n]=i;});
function spr(n,x,y,w,o){
  const im=IMG[n];o=o||{};
  if(!im||!im.ok){ctx.fillStyle=o.fb||'#c9a23a';ctx.beginPath();ctx.arc(x,y,w*.35,0,TAU);ctx.fill();return;}
  const h=w*im.height/im.width;ctx.save();ctx.translate(x,y);if(o.rot)ctx.rotate(o.rot);if(o.flip)ctx.scale(-1,1);if(o.sy)ctx.scale(1,o.sy);
  if(o.alpha!=null)ctx.globalAlpha*=o.alpha;ctx.drawImage(im,-w/2,-h/2,w,h);
  if(o.flash){ctx.globalCompositeOperation='lighter';ctx.globalAlpha*=Math.min(1,o.flash);ctx.drawImage(im,-w/2,-h/2,w,h);}
  ctx.restore();}
function bgDraw(n){const im=IMG[n];if(im&&im.ok)ctx.drawImage(im,0,0,W,H);else{ctx.fillStyle='#5aa848';ctx.fillRect(0,0,W,H);}}
function shadow(x,y,rx,ry,a){ctx.fillStyle=`rgba(0,0,0,${a||.25})`;ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,TAU);ctx.fill();}

/* ---------- сохранение ---------- */
const SKEY='super-bdzholy-1';
let save={honey:0,owned:{me:true},level:0,seenStory:false,seenStory2:false,seenHelp:false,lastCtrl:'me',voice:true,sound:true,finished:false,
  up:{me:{dmg:0,rate:0,hp:0},dad:{dmg:0,rate:0,hp:0},sis:{dmg:0,rate:0,hp:0},vault:0,charge:0},stars:{}};
try{const s=JSON.parse(localStorage.getItem(SKEY)||'null');if(s){const up=save.up;save=Object.assign(save,s);
  save.up=Object.assign(up,s.up||{});['me','dad','sis'].forEach(k=>save.up[k]=Object.assign({dmg:0,rate:0,hp:0},save.up[k]||{}));save.stars=save.stars||{};}save.owned.me=true;}catch(e){}
if(save.finished&&save.level<4)save.level=4;
function persist(){try{localStorage.setItem(SKEY,JSON.stringify(save))}catch(e){}}
let voiceOn=save.voice!==false, soundOn=save.sound!==false;

/* ---------- звук и голос ---------- */
let AC=null;
function tone(f,dur,type,vol,slide){if(!soundOn)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();
  if(AC.state==='suspended')AC.resume();const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+dur);
  g.gain.setValueAtTime(vol||.08,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+dur+.02);}catch(e){}}
const SFX={shot:()=>tone(900,.05,'square',.02,650),big:()=>tone(430,.15,'sawtooth',.045,170),spike:()=>tone(320,.13,'triangle',.09,760),
  hit:()=>tone(210,.05,'square',.025,120),honey:()=>tone(1200,.09,'sine',.05,1750),hurt:()=>tone(170,.25,'sawtooth',.07,80),
  boom:()=>tone(90,.55,'sawtooth',.13,30),sleep:()=>tone(520,.7,'sine',.08,190),roar:()=>tone(115,.7,'sawtooth',.1,55),
  splash:()=>tone(700,.25,'sine',.07,180),spit:()=>tone(260,.12,'triangle',.05,520),clank:()=>tone(1500,.04,'square',.03,900),
  super:()=>[392,523,784].forEach((f,i)=>setTimeout(()=>tone(f,.18,'sawtooth',.06),i*70)),
  click:()=>tone(660,.05,'triangle',.05),win:()=>[523,659,784,1046].forEach((f,i)=>setTimeout(()=>tone(f,.2,'triangle',.08),i*130))};
/* Голос: заранее записанные фразы art/voice/<ключ>.mp3. Если файла нет, игра молчит, а текст на экране остаётся. */
/* Рассказчик Влад, слова Королевы голосом Елены: фраза может быть цепочкой ключей, они играют подряд. */
const VOICE_READY=true;
let curKey='',vo=null,voSeq=0;
function say(key){curKey=key;if(!VOICE_READY||!voiceOn||!key)return;hush();const keys=Array.isArray(key)?key:[key],my=++voSeq;
  const play=i=>{if(i>=keys.length||my!==voSeq)return;try{vo=new Audio('art/voice/'+keys[i]+'.mp3');vo.onended=()=>play(i+1);vo.play().catch(()=>{});}catch(e){}};play(0);}
function hush(){voSeq++;try{if(vo){vo.onended=null;vo.pause();vo=null;}}catch(e){}}

/* ---------- герои, враги, уровни ---------- */
const BEES={
  me:{id:'me',img:'bee-me',w:66,name:'Я',tag:'стреляю сильно, пробиваю броню',price:0,speed:250,hp:6,kind:'shot',dmg:3,rate:.6,bs:480,br:8,
      sup:'Мега-жало',supTxt:'5 огромных жал насквозь'},
  dad:{id:'dad',img:'bee-dad',w:74,name:'Папа',tag:'стреляет очень быстро',price:30,speed:230,hp:9,kind:'shot',dmg:1,rate:.13,bs:660,br:4,
      sup:'Шквал',supTxt:'жала во все стороны'},
  sis:{id:'sis',img:'bee-sis',w:60,name:'Сестра',tag:'бьётся шипами, всех рядом',price:30,speed:285,hp:7,kind:'spikes',dmg:2,rate:.75,reach:85,
      sup:'Шипастая волна',supTxt:'волна шипов, жуки замирают'},
};
const ORDER=['me','dad','sis'];
const UPS=[['dmg','Сила'],['rate','Скорость жала'],['hp','Здоровье']];
const UPCOST=[20,40,70];
const TEAMUPS=[['vault','Крепкая тюрьма','+25 мёда в тюрьме',[25,50,80]],['charge','Быстрый супер-удар','супер заряжается быстрее',[30,60,90]]];
function stat(b){const u=save.up[b.id]||{dmg:0,rate:0,hp:0},d=b.d;return{dmg:d.dmg*(1+.35*u.dmg),rate:d.rate/(1+.25*u.rate),hp:d.hp+2*u.hp};}
const EK={
  b:{hp:3,sp:55,r:16,honey:2,bite:2,img:'beetle',w:50,rot:true,col:'#4caf50'},
  f:{hp:2,sp:100,r:12,honey:2,bite:1.5,img:'fast',w:40,rot:true,col:'#c6e046'},
  big:{hp:10,sp:36,r:25,honey:5,bite:4,img:'big',w:84,rot:false,col:'#2e5d32'},
  arm:{hp:6,sp:44,r:18,honey:4,bite:2,img:'armored',w:56,rot:true,armor:1.5,col:'#a9b0b8'},
  spit:{hp:4,sp:50,r:16,honey:4,bite:1,img:'spitter',w:52,rot:true,spit:true,col:'#a8c43a'},
};
const LEVELS=[
  {name:'Зелёные жуки',mode:'defend',bg:'bg-meadow',amb:'pollen',waves:[{b:6},{b:8},{b:10}],
   say:'Плохие зелёные жуки хотят утащить мёд Королевы! Не пускай их к середине. Пчёлка жалит сама, ты только веди её.',
   tip:'Веди пчёлку пальцем. Она жалит сама.'},
  {name:'Быстрые и бронированные',mode:'defend',bg:'bg-meadow',amb:'pollen',waves:[{b:6,f:4},{b:4,big:2,f:3,arm:2},{b:5,f:5,big:3,arm:3}],
   say:'Теперь есть быстрые жуки, большие жуки и жуки в железной броне. Броню лучше всех пробивает пчёлка Я. Позови Папу и Сестру, вместе легче.',
   tip:'Жуков в броне лучше бить пчёлкой Я.'},
  {name:'Серый медведь',mode:'boss',bg:'bg-meadow',amb:'pollen',bosses:[{k:'bear',at:1.5}],
   say:'Идёт серый медведь! Он хочет съесть весь мёд. Нам надо биться сильно. Когда вокруг медведя красный круг, улетай!',
   tip:'Красный круг: медведь сейчас ударит! Улетай.'},
  {name:'Усыпитель',mode:'sneak',bg:'bg-dusk',amb:'fireflies',
   say:'Пришёл дядя со специальной штукой, которая усыпляет пчёл. Это усыпитель. Не попадай в фиолетовый луч и сонные облака, а то уснёшь. Прячься за цветами, проберись к усыпителю и сломай его!',
   tip:'Прячься за цветами. Под усыпителем безопасно.'},
  {name:'Армия под дождём',mode:'defend',bg:'bg-storm',amb:'rain',rain:true,waves:[{b:8,spit:3},{arm:4,f:6,spit:3},{b:8,big:4,spit:4,arm:3}],
   say:'Король Жуков послал первую армию, и пошёл дождь. Где на земле тёмный круг, сейчас упадёт большая капля, отлетай! А пятнистые жуки плюются липкой слизью.',
   tip:'Тёмный круг: сейчас упадёт капля. Отлетай!'},
  {name:'Сто тысяч жуков',mode:'horde',bg:'bg-night',amb:'fireflies',dark:true,vault:150,
   say:'Вот они, сто тысяч жуков! Наступила ночь, светло только возле пчёл. Каждый жук тут за тысячу. Побей их всех, пока счётчик не станет ноль.',
   tip:'Ночью светло только возле пчёл. Летайте вместе.'},
  {name:'Король Жуков',mode:'boss',bg:'bg-kingdom',amb:'embers',bosses:[{k:'bear',at:1.5},{k:'king',at:5}],
   say:'Король Жуков и медведь пришли вместе! Король всё время зовёт новых жуков. Бейтесь сильно и улетайте от красного круга!',
   tip:'Победи и медведя, и Короля Жуков.'},
];
const STORY=[
  {t:'Жили-были пчёлы. Они летали по цветам, собирали мёд и жили хорошо.',v:'s1'},
  {t:'Но однажды Королева позвала пчёл: «Летите охранять мою тюрьму! В середине там очень много мёда».',v:['s2','s2q']},
  {t:'Мёд хотят утащить плохие зелёные жуки. А потом придёт серый медведь, и нам надо будет биться сильно.',v:'s3'},
  {t:'Ты стреляешь сильно. Папа стреляет очень быстро. Сестра бьётся шипами. Сначала летишь ты, а Папу и Сестру можно позвать за мёд.',v:'s4'},
];
const STORY2=[
  {t:'Ура! Усыпитель сломан, дядя убежал. Сначала мы победили всех, и мёд был спасён.',v:'t1'},
  {t:'Но медведь ожил! Он встал и пошёл к Королю Жуков.',v:'t2'},
  {t:'Король Жуков позвал всех жуков. Их было сто тысяч! Он собрал их, и теперь мы будем с ними биться.',v:'t3'},
];
const FINAL={t:'Ура! Король Жуков и медведь убежали далеко-далеко, а все сто тысяч жуков разбежались. Королева говорит: «Спасибо, Супер Бджолы! Вы самые храбрые пчёлы!»',v:['final','finalq']};
const HELP_V='help';
const SNEAK_FLOWERS=[{x:300,y:175,r:42},{x:300,y:430,r:42},{x:520,y:300,r:46},{x:680,y:165,r:40},{x:680,y:440,r:40}];
const SNEAK_CLOUDS=[{x:415,y0:300,amp:210,sp:1.05,ph:0,r:30},{x:600,y0:300,amp:230,sp:.8,ph:2,r:32},{x:745,y0:300,amp:180,sp:1.35,ph:1,r:28}];
const SAFE_R=85, BEAM_W=.17, START={x:70,y:300}, TEAM_R=150, TEAM_BONUS=1.3;
const PORTS=ORDER.map((id,k)=>({id,x:46+k*76,y:H-46,r:30}));
const SUPBTN={x:W-62,y:H-62,r:42};

/* ---------- мелкие рисовалки ---------- */
function dot(x,y,r){ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.fill();}
function rr(x,y,w,h,r){r=Math.min(r,h/2,w/2);ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function txt(s,x,y,size,col,align,stroke){ctx.font=`700 ${size}px Rubik, system-ui, sans-serif`;ctx.textAlign=align||'center';ctx.textBaseline='middle';
  ctx.lineJoin='round';ctx.lineWidth=Math.max(3,size/5);ctx.strokeStyle=stroke||INK;ctx.strokeText(s,x,y);ctx.fillStyle=col||'#fff';ctx.fillText(s,x,y);}
function bar(x,y,w,h,k,col){k=Math.max(0,Math.min(1,k));ctx.fillStyle='rgba(0,0,0,.4)';rr(x,y,w,h,h/2);ctx.fill();
  if(k>0){ctx.fillStyle=col;rr(x,y,Math.max(h,w*k),h,h/2);ctx.fill();}ctx.strokeStyle=INK;ctx.lineWidth=2.5;rr(x,y,w,h,h/2);ctx.stroke();}
function drawPot(x,y,s){ctx.save();ctx.translate(x,y);ctx.scale(s,s);ctx.strokeStyle=INK;ctx.lineWidth=2.5;
  ctx.fillStyle='#ffb21e';ctx.beginPath();ctx.ellipse(0,3,14,12,0,0,TAU);ctx.fill();ctx.stroke();
  ctx.fillStyle='#c98a2b';rr(-10,-12,20,7,3);ctx.fill();ctx.stroke();ctx.restore();}
function drawLock(x,y){ctx.strokeStyle='#fff';ctx.lineWidth=3.5;ctx.beginPath();ctx.arc(x,y-4,7,Math.PI,0);ctx.stroke();ctx.fillStyle='#fff';rr(x-10,y-4,20,15,3);ctx.fill();ctx.fillStyle=INK;dot(x,y+3,2.2);}

/* ---------- персонажи ---------- */
function drawBee(x,y,o){
  const d=o.d,w=(o.w||d.w)*(o.s||1),t=o.t||0;
  if(o.shadow!==false)shadow(x+4,y+w*.55,w*.32,w*.09,.22);
  const buzz=o.sleep?1:1+Math.sin(t*55+(o.ph||0))*.03;
  spr(d.img,x,y,w,{flip:o.face<0,rot:(o.rot||0)*(o.face<0?-1:1),sy:buzz,alpha:o.alpha,flash:o.flash});
  if(!o.sleep&&IMG[d.img].ok){ctx.save();ctx.globalAlpha=.18+.12*Math.sin(t*60+(o.ph||0));ctx.fillStyle='#ffffff';

/* ---------- обновление ---------- */
function buildQueue(w){const q=[];for(const k in w)for(let i=0;i<w[k];i++)q.push(k);for(let i=q.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[q[i],q[j]]=[q[j],q[i]];}return q;}
function spawnEnemy(k){const d=EK[k],side=Math.random()*4|0;let x,y;
  if(side===0){x=-30;y=80+Math.random()*440;}else if(side===1){x=W+30;y=80+Math.random()*440;}else if(side===2){y=-30;x=60+Math.random()*840;}else{y=H+30;x=60+Math.random()*840;}
  const hp=d.hp*toughness();
  const e={kind:k,hp,max:hp,sp:d.sp*(G.i>=4?1.12:1),r:d.r,honey:d.honey,bite:d.bite,x,y,ph:Math.random()*TAU,flash:0,ang:0,eat:false,stun:0,cd:1+Math.random()};
  G.enemies.push(e);return e;}
function waveLogic(dt){
  if(G.queue.length===0&&G.enemies.length===0){
    if(G.wave>=G.L.waves.length-1)return levelWon();
    G.gap-=dt;if(G.gap<=0){G.wave++;G.queue=buildQueue(G.L.waves[G.wave]);G.gap=2.2;G.spawnT=.3;banner(`Волна ${G.wave+1} из ${G.L.waves.length}`);}
    return;}
  G.spawnT-=dt;if(G.queue.length&&G.spawnT<=0){spawnEnemy(G.queue.shift());G.spawnT=Math.max(.35,1-G.wave*.15);}
}
/* Чем больше пчёл в команде и чем дальше уровень, тем крепче жуки: иначе с полной командой слишком легко. */
function toughness(){return (1+.35*(G.bees.length-1))*(1+.08*G.i);}
function makeBoss(k){
  const m=toughness();
  if(k==='bear')return{kind:'bear',hp:180*m,max:180*m,sp:30,r:58,honey:30,bite:5,reach:140,x:W+70,y:330,state:'walk',swCd:2.5,st:0,face:-1,flash:0,eat:false,stun:0};
  return{kind:'king',hp:260*m,max:260*m,sp:26,r:44,honey:40,bite:6,x:-60,y:290,ang:0,ph:0,flash:0,sumCd:4,eat:false,stun:0};
}
function bossLogic(dt){
  for(const q of G.bossQ)if(!q.on&&G.t>=q.at){q.on=true;G.enemies.push(makeBoss(q.k));SFX.roar();
    banner(q.k==='bear'?(G.i>3?'Медведь ожил и вернулся!':'Серый медведь идёт!'):'Король Жуков пришёл!');}
  if(G.bossesLeft<=0){if(G.enemies.length===0)levelWon();return;}
  G.spawnT-=dt;if(G.spawnT<=0){G.spawnT=6;spawnEnemy(G.i>3&&Math.random()<.5?'spit':'b');}
}
function hordeLogic(dt){
  if(G.left<=0){if(G.enemies.length===0)levelWon();return;}
  G.spawnT-=dt;
  if(G.spawned<100&&G.spawnT<=0&&G.enemies.length<20){const r=Math.random();spawnEnemy(r<.45?'b':r<.75?'f':r<.88?'arm':'big');G.spawned++;G.spawnT=Math.max(.3,.6-G.spawned*.003);}
}
function rainLogic(dt){
  G.rainT-=dt;
  if(G.rainT<=0){G.rainT=2.2+Math.random()*1.4;const act=G.bees.filter(b=>b.down<=0);const b=act[Math.random()*act.length|0];
    if(b)G.drops.push({x:b.x+(Math.random()-.5)*90,y:b.y+(Math.random()-.5)*90,t:1.3});}
  for(const d of G.drops){d.t-=dt;if(d.t<=0&&!d.done){d.done=true;SFX.splash();burst(d.x,d.y,'#bfe3ff',22,240);
    for(const b of G.bees)if(b.down<=0&&Math.hypot(b.x-d.x,b.y-d.y)<58){b.wet=1.3;addText(b.x,b.y-34,'Намокла!','#bfe3ff');}
    for(const e of G.enemies)if(Math.hypot(e.x-d.x,e.y-d.y)<58&&e.kind!=='bear'&&e.kind!=='king')e.stun=Math.max(e.stun,1);}}

function angDiff(a,b){let d=a-b;while(d>Math.PI)d-=TAU;while(d<-Math.PI)d+=TAU;return d;}
function shadowed(x,y){const D=G.dev,aB=Math.atan2(y-D.y,x-D.x),dB=Math.hypot(x-D.x,y-D.y);
  for(const f of G.flowers){if(Math.hypot(x-f.x,y-f.y)<f.r)return true;const dF=Math.hypot(f.x-D.x,f.y-D.y),half=Math.asin(Math.min(1,f.r/dF)),aF=Math.atan2(f.y-D.y,f.x-D.x);
    if(Math.abs(angDiff(aB,aF))<half*.92&&dB>Math.sqrt(Math.max(0,dF*dF-f.r*f.r)))return true;}return false;}
function inBeam(x,y){const D=G.dev,dx=x-D.x,dy=y-D.y,dB=Math.hypot(dx,dy);if(dB<SAFE_R)return false;
  if(Math.abs(angDiff(Math.atan2(dy,dx),G.beamA))>BEAM_W+10/dB)return false;return !shadowed(x,y);}
function sneakLogic(dt){
  if(!G.dev.dead)G.beamA=Math.PI+Math.sin(G.t*.75)*1.15;
  G.clouds.forEach(c=>c.y=c.y0+Math.sin(G.t*c.sp+c.ph)*c.amp);
  G.dev.flash=Math.max(0,G.dev.flash-dt);
  const b=G.bees[0];
  if(b&&!G.dev.dead&&b.sleep<=0&&b.hurt<=0){
    if(G.clouds.some(c=>Math.hypot(b.x-c.x,b.y-c.y)<c.r+10)||inBeam(b.x,b.y)){b.sleep=1.6;G.tries++;SFX.sleep();addText(b.x,b.y-34,'Ой, уснула!','#e9d8ff');}}

  story(){storyScreen(0,'a');},
  next(){const S=storySet==='b'?STORY2:STORY;if(storyI<S.length-1)storyScreen(storyI+1);
    else{if(storySet==='b')save.seenStory2=true;else save.seenStory=true;persist();if(!save.seenHelp)helpScreen('hive');else hiveScreen();}},
  listen(){const v=voiceOn;voiceOn=true;say(curKey);voiceOn=v;},
  title(){titleScreen();},
  help(){helpScreen(scene==='title'?'title':'hive');},
  helpPause(){helpScreen('pause');},
  helpok(){save.seenHelp=true;persist();hush();if(helpBack==='title')titleScreen();else if(helpBack==='pause'){scene='play';paused=false;pauseGame();}else hiveScreen(hiveSel);},
  voice(){voiceOn=!voiceOn;save.voice=voiceOn;persist();if(!voiceOn)hush();titleScreen();},
  sound(){soundOn=!soundOn;save.sound=soundOn;persist();titleScreen();},
  buy(id){const d=BEES[id];if(save.owned[id]||save.honey<d.price)return;save.honey-=d.price;save.owned[id]=true;persist();SFX.win();hiveScreen(hiveSel);say('buy_'+id);},
  up(v){const [a,b]=v.split('.');
    if(b){const lv=save.up[a][b],cost=UPCOST[lv];if(lv>=3||save.honey<cost)return;save.honey-=cost;save.up[a][b]++;}
    else{const t=TEAMUPS.find(x=>x[0]===a),lv=save.up[a],cost=t[3][lv];if(lv>=3||save.honey<cost)return;save.honey-=cost;save.up[a]++;}
    persist();SFX.honey();hiveScreen(hiveSel);},
  lvl(v){hiveScreen(+v);},
  intro(){introScreen(hiveSel);},
  go(){startLevel(introI);},
  hive(){hiveScreen();},
  resume(){paused=false;hide();},
  retry(){startLevel(G?G.i:introI);},
};
ov.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b||b.disabled)return;SFX.click();ACT[b.dataset.a](b.dataset.v);});

/* ---------- управление ---------- */
function toWorld(e){return{x:(e.clientX-ox)/sc,y:(e.clientY-oy)/sc};}
function hudClick(p){
  if(Math.hypot(p.x-(W-34),p.y-30)<28){pauseGame();return true;}
  if(G.mode!=='sneak'&&Math.hypot(p.x-SUPBTN.x,p.y-SUPBTN.y)<SUPBTN.r+8){if(G.charge>=1)doSuper();else addText(SUPBTN.x-60,SUPBTN.y-70,'Ещё не заряжено','#fff');return true;}
  for(const q of PORTS)if(Math.hypot(p.x-q.x,p.y-q.y)<q.r+6){if(save.owned[q.id])setCtrl(q.id);else addText(q.x+60,q.y-50,'Позови в улье за '+BEES[q.id].price+' мёда','#ffd84d');return true;}
  return false;}
cv.addEventListener('pointerdown',e=>{if(scene!=='play'||!G||paused)return;const p=toWorld(e);if(hudClick(p))return;
  P.down=true;P.x=p.x;P.y=p.y;try{cv.setPointerCapture(e.pointerId)}catch(_){}});
cv.addEventListener('pointermove',e=>{if(!P.down)return;const p=toWorld(e);P.x=p.x;P.y=p.y;});
['pointerup','pointercancel','lostpointercapture'].forEach(n=>cv.addEventListener(n,()=>{P.down=false;}));
addEventListener('keydown',e=>{K[e.code]=true;
  if(scene==='play'&&G){if(e.code==='Digit1')setCtrl('me');if(e.code==='Digit2')setCtrl('dad');if(e.code==='Digit3')setCtrl('sis');
    if(e.code==='Space')doSuper();
    if(e.code==='Escape'||e.code==='KeyP'){if(paused)ACT.resume();else pauseGame();}}
  if(/^Arrow/.test(e.code)||e.code==='Space')e.preventDefault();});
addEventListener('keyup',e=>{K[e.code]=false;});
addEventListener('blur',()=>{for(const k in K)K[k]=false;P.down=false;});
document.addEventListener('visibilitychange',()=>{if(document.hidden)pauseGame();});

titleScreen();
</script>
